[build-system]
requires = ["setuptools==83.0.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "icapa"
version = "0.1.0"
description = "Provider-neutral index construction, simulation, analytics, and reporting"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ICAPA contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy==1.26.4",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "scipy==1.13.1",
    "xlrd==2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "setuptools==83.0.0",
    "wheel==0.45.1",
]
qp = ["osqp==1.0.4"]
analytics = [
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "statsmodels==0.14.6",
    "tqdm==4.70.0",
]
explainability = [
    "ipywidgets==8.1.8",
    "shap==0.52.0",
]
notebook = [
    "ipython==9.15.0",
    "ipywidgets==8.1.8",
    "matplotlib==3.11.1",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "scale: opt-in index-research scale and performance tests",
]

[tool.setuptools]
include-package-data = false
packages = [
    "icapa",
    "icapa.analytics",
    "icapa.analytics.attribution",
    "icapa.analytics.comparison",
    "icapa.analytics.constituents",
    "icapa.analytics.core",
    "icapa.analytics.events",
    "icapa.analytics.exposures",
    "icapa.analytics.performance",
    "icapa.analytics.plugins",
    "icapa.analytics.quality",
    "icapa.analytics.reconciliation",
    "icapa.analytics.regimes",
    "icapa.analytics.risk",
    "icapa.backtesting",
    "icapa.backtesting.calendar",
    "icapa.backtesting.reviews",
    "icapa.backtesting.simulation",
    "icapa.data_sources",
    "icapa.data_sources.providers",
    "icapa.data_sources.providers.factset",
    "icapa.data_sources.providers.snowflake",
    "icapa.data_sources.provenance",
    "icapa.data_sources.services",
    "icapa.data_sources.universes",
    "icapa.portfolio_construction",
    "icapa.portfolio_construction.optimization",
    "icapa.portfolio_construction.recipes",
    "icapa.portfolio_construction.rules",
    "icapa.portfolio_construction.rules.data_loading",
    "icapa.reporting",
    "icapa.reporting.builders",
    "icapa.reporting.dashboards",
    "icapa.reporting.excel",
    "icapa.research",
    "icapa.research.catalog",
    "icapa.research.notebook",
    "icapa.research.runners",
    "icapa.research.scenarios",
    "icapa.research.sensitivity",
    "icapa.workspace",
    "icapa.workspace.caches",
    "icapa.workspace.readers",
]

[tool.setuptools.package-dir]
icapa = "."

[tool.setuptools.package-data]
icapa = [
    "assets/icapa.png",
    "reporting/templates/index_research_report.xlsx",
]
